[project]
name = "cognos-to-power-bi-migration"
version = "0.0.1"
description = "Private code-only development snapshot for supervised Cognos migrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cognos2powerbi",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "mypy>=1.9",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.uv.sources]
cognos2powerbi = { path = 'tools\cognos-to-powerbi', editable = true }

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "tools/cognos-to-powerbi/tests"]
